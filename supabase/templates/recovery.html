<div style="font-family: Arial, Helvetica, sans-serif; background-color: #f7f5fd; padding: 32px 16px; color: #1f1b2e;">
  <div style="max-width: 480px; margin: 0 auto; background-color: #ffffff; border: 1px solid #e4e0f2; border-radius: 16px; padding: 32px;">
    <p style="margin: 0 0 24px; font-size: 22px; font-weight: bold; color: #6d5bd0;">Divã</p>
    <h1 style="margin: 0 0 12px; font-size: 20px;">Crie uma nova senha</h1>
    <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: #4b4660;">
      Recebemos um pedido para trocar a senha da sua conta no Divã. O link vale por pouco tempo e só pode ser usado uma vez.
    </p>
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background-color: #6d5bd0; color: #ffffff; text-decoration: none; font-weight: bold; font-size: 15px; padding: 12px 24px; border-radius: 10px;">

    <p style="margin: 24px 0 0; font-size: 13px; line-height: 1.6; color: #6b6680;">

    </p>
